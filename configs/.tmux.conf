# Mouse: scroll, select, resize panes, switch windows
set -g mouse on

# Keep more scrollback history
set -g history-limit 100000

# True color (helps Powerlevel10k inside tmux)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# Copy mouse selections to the system clipboard
set -g set-clipboard on

# WSL: copy selection to Windows clipboard
# Linux: fall back to wl-copy / xclip when available
if-shell 'command -v clip.exe >/dev/null 2>&1' {
    bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "clip.exe"
    bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "clip.exe"
} {
    if-shell 'command -v wl-copy >/dev/null 2>&1' {
        bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
        bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
    } {
        if-shell 'command -v xclip >/dev/null 2>&1' {
            bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard"
            bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard"
        }
    }
}
